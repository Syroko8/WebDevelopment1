<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oráculo de los números</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="game-card">
        <h1>Oráculo</h1>
        <p class="instructions">Introduce un número del 1 al 100.</p>
        <form id="guessForm">
            <label for="textInput">Tu intento:</label>
            <div class="guess-row">
                <input type="number" id="textInput" min="1" max="100" required autofocus>
                <button type="submit" id="btnProbar">Probar</button>
            </div>
        </form>
        <p id="result" class="result"></p>
        <p id="intentosText">Intentos restantes: 7</p>
        <p id="historialText"></p>
        <button id="btnReiniciar" style="display: none;">Nueva profecía</button>
    </main>
</body>
</html>
