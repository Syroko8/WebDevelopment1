<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <div class="mainContent">
        <h1>Oráculo</h1>
        <p class="instructions">Introduce un numero del 1 al 100 hasta encontrar el valor secreto.</p>
        <form id="guessForm">
            <label for="textInput">Tu intento</label>
            <div class="Input">
                <input type="text" id="textInput" min="1" max="100" required autofocus>
                <button type="submit">Enviar</button>
            </div>
        </form>
        <p id="result" class="result"></p>
    </div>
</body>
