<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="stylesheet" href="src/styles/app.css">
    <link rel="stylesheet" href="src/styles/itemCard.css">
    <link rel="stylesheet" href="src/styles/itemContainer.css">
    <link rel="stylesheet" href="src/styles/sideBar.css">
    <link rel="stylesheet" href="src/styles/filterMenu.css">

    <script type="module" src="./src/components/sidebar.ts" defer></script>
    <script type="module" src="./src/components/formulary.ts" defer></script>
    <script type="module" src="./src/components/itemContainer.ts" defer></script>

    <title>m2-asyncodyssey</title>
  </head>
  <body>  
    <div class="sidebar enabled">
        <div class="toggler-container enabled">
          <h1 class="title enabled">Delusion Tracker</h1>
          <div class="toggler">
            <div class="toggler-bar enabled"></div>
          </div>
        </div>

        <div class="filters enabled">
            <div class="type-selector">
              <button class="manga-selector">Manga</button>
              <button class="anime-selector" disabled>Anime</button>
            </div>
            <form class="filter-form" id="filter-form">
                
              <div class="field">
                <label class="field-label" for="name">Name</label>
                <input type="text" name="name" id="name" placeholder="Search by title" />
              </div>
              
              <div class="field genre-field">
                <label class="field-label" for="genre-search">Genres <small id="genre-count"></small></label>
                <input type="search" id="genre-search" placeholder="Find a genre"/>
                <div class="genre-list" hidden id="genre-list"></div>
              </div>

              <div class="field">
                <label class="field-label" for="year">Year</label>
                <input type="number" id="year" name="year" min="1940" placeholder="2026" />
              </div>

              <div class="field">
                <label for="seasons" class="field-label">Seasons</label>
                <select name="seasons" id="seasons"></select>
              </div>

              <div class="field">
                <label class="field-label" for="airingStatus">Airing status</label>
                <select name="airingStatus" id="airingStatus"></select>
              </div>

              <button type="button" class="search-button">Search</button>
            </form>
        </div>
    </div>

    <div class="item-container">
      <div class="inner"><p>Inserte los filtros deseados y haga su búsqueda</p></div>
    </div>

  </body>
</html>
